name: Boletins de urna do exterior

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boletins
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/boletins-exterior.mjs
      - name: Publica os dados se mudaram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exterior-bu.json data/boletins-cache.json
          if git diff --cached --quiet -- data/boletins-cache.json; then
            echo "Nenhum boletim novo."
            exit 0
          fi
          git commit -m "Atualiza boletins de urna do exterior"
          git pull --rebase
          git push
